<!DOCTYPE html>

    <link rel="icon" href="favicon.png" type="BurnUI/png">

    <style>
        
        html, body {
        height: 100%;
        margin: 0;
    }
        
        .top {
            
            background-color: red;
            border-bottom-right-radius: 50px;
            border-top-right-radius: 50px;
            border: 5px solid yellow;
            align-items: center;
            
        }
        
        .button {
            
            background-color: orangered;
            color: yellow;
            border: 5px solid yellow;
            border-radius: 12px;
            transition: transform 0.8s ease-in-out;
            
        }
        
        .button:hover {
            
            cursor: pointer;
            background-color: yellow;
            color: orangered;
            border: 5px solid orangered;
            border-radius: 12px;
            
        }
        
        .game {
            
            margin: 35px;
            background-color: red;
            width: 400px;
            display: grid;
            place-items: center;
            border: 5px solid yellow;
            height: 400px;
            border-radius: 52px;
            
        }
        
        .gameTitle {
            
            color: yellow;
            
        }
        
        .games {
            
            display: flex;
            
        }
        
        .mF {
            
            color: greenyellow;
            font-size: 10px;
            
        }
        
    </style>
    
</head>
