<!DOCTYPE html>
<html>
<head>
    
    <title>BurnUI</title>
    
    <link rel="icon" href="BurnUI.png" type="image/png">
    <link rel="shortcut icon" href="BurnUI.png" type="image/png">
    
    <link rel="apple-touch-icon" sizes="180x180" href="BurnUI.png">
    <link rel="apple-touch-icon" sizes="152x152" href="BurnUI.png">
    <link rel="apple-touch-icon" sizes="120x120" href="BurnUI.png">
    
    <style>
        
        html, body {
            height: 100%;
            margin: 0;
        }
        
        .top {
            background-color: red;
            border-bottom-right-radius: 50px;
            border-top-right-radius: 50px;
            border: 5px solid yellow;
            align-items: center;
            display: flex;
            margin: 35px;
        }
        
        .button {
            background-color: orangered;
            color: yellow;
            border: 5px solid yellow;
            border-radius: 12px;
            transition: transform 0.8s ease-in-out;
        }
        
        .button:hover {
            cursor: pointer;
            background-color: yellow;
            color: orangered;
            border: 5px solid orangered;
            border-radius: 12px;
        }
        
        .game {
            margin: 35px;
            background-color: red;
            width: 400px;
            display: grid;
            place-items: center;
            border: 5px solid yellow;
            height: 400px;
            border-radius: 52px;
        }
        
        .gameTitle {
            color: yellow;
        }
        
        .games {
            display: flex;
            flex-wrap: wrap;
        }
        
        .mF {
            color: greenyellow;
            font-size: 10px;
        }
        
    </style>
    
</head>
<body style="background-image: linear-gradient(to bottom, orange, red); background-repeat: no-repeat; height: 100%; background-size: cover; background-attachment: fixed; background-color: black;">
    
    <div class="top">
        <h1 style="font-size: 50px; font-family: Arial, Helvetica, sans-serif;">BurnUI</h1>
        <p style="color: red" id="DIVIDER">====</p>
        <a href="Profile.html"><button style="height: 50px;" class="button">Profile</button></a>
    </div>

    <!-- SEARCH BAR -->
    <div style="width: 100%; text-align: center; margin-top: 20px;">
        <input id="searchBar"
               type="text"
               placeholder="Search games..."
               oninput="searchGames()"
               style="width: 94.5%; padding: 15px; font-size: 20px; border-radius: 12px; border: 4px solid yellow;">
    </div>
    
    <div class="games">
        
        <div class="game" id="movieMaker">
            <img src="https://cdn2.scratch.mit.edu/get_image/project/1326918795_144x108.png" width="300" style="border-radius: 40px; border: 2px solid yellow;">
            <h2 class="gameTitle">Movie Maker Beta (0.5)</h2>
            <p class="gameTitle">Cost: 3 BurnBux | By: BurnUI</p>
            <button class="button" style="width: 300px;" onclick="playMovieMaker()">Play</button>
        </div>
        
        <div class="game" id="etup">
            <img src="https://cdn2.scratch.mit.edu/get_image/project/1319222966_144x108.png" width="300" style="border-radius: 40px; border: 2px solid yellow;">
            <h2 class="gameTitle">ETUP</h2>
            <p class="gameTitle">By: BurnUI</p>
            <a href="https://scratch.mit.edu/projects/1319222966/fullscreen/" target="_blank" rel="noopener noreferrer">
                <button class="button" style="width: 300px;">Play</button>
            </a>
        </div>
        
        <div class="game" id="ballBounce">
            <img src="https://cdn2.scratch.mit.edu/get_image/project/1312324340_144x108.png" width="300" style="border-radius: 40px; border: 2px solid yellow;">
            <h2 class="gameTitle">Ball Bounce</h2>
            <p class="gameTitle">By: BurnUI</p>
            <p class="mF">mobile friendly</p>
            <a href="https://scratch.mit.edu/projects/1312324340/fullscreen/" target="_blank" rel="noopener noreferrer">
                <button class="button" style="width: 300px;">Play</button>
            </a>
        </div>
        
        <div class="game" id="scratchCat">
            <img src="https://cdn2.scratch.mit.edu/get_image/project/1321858910_144x108.png" width="300" style="border-radius: 40px; border: 2px solid yellow;">
            <h2 class="gameTitle">Scratch Cat In Every...</h2>
            <p class="gameTitle">By: BurnUI</p>
            <p class="mF">mobile friendly</p>
            <a href="https://scratch.mit.edu/projects/1321858910/fullscreen/" target="_blank" rel="noopener noreferrer">
                <button class="button" style="width: 300px;">Play</button>
            </a>
        </div>
        
        <div class="game" id="rockBuddy">
            <img src="https://cdn2.scratch.mit.edu/get_image/project/1197474488_144x108.png" width="300" style="border-radius: 40px; border: 2px solid yellow;">
            <h2 class="gameTitle">My Rock Buddy</h2>
            <p class="gameTitle">By: BurnUI</p>
            <p class="mF">mobile friendly</p>
            <a href="https://scratch.mit.edu/projects/1197474488/fullscreen/" target="_blank" rel="noopener noreferrer">
                <button class="button" style="width: 300px;">Play</button>
            </a>
        </div>
        
    </div>

<script>
function searchGames() {
    const query = document.getElementById("searchBar").value.toLowerCase();

    const games = [
        { id: "movieMaker", name: "movie maker beta burnui 0.5" },
        { id: "etup", name: "etup burnui" },
        { id: "ballBounce", name: "ball bounce burnui mobile" },
        { id: "scratchCat", name: "scratch cat in every burnui mobile" },
        { id: "rockBuddy", name: "my rock buddy burnui mobile" }
    ];

    games.forEach(game => {
        const element = document.getElementById(game.id);
        if (game.name.includes(query)) {
            element.style.display = "grid";
        } else {
            element.style.display = "none";
        }
    });
}

// MOVIE MAKER COST SYSTEM
function playMovieMaker() {
    const user = localStorage.getItem("loggedInUser");
    if (!user) {
        alert("You must log in to spend BurnBux.");
        return;
    }

    const account = JSON.parse(localStorage.getItem(user));

    if (account.burnbux >= 3) {
        account.burnbux -= 3;
        localStorage.setItem(user, JSON.stringify(account));
        window.open("https://scratch.mit.edu/projects/1326918795/fullscreen/", "_blank");
    } else {
        alert("You need 3 BurnBux to play Movie Maker!");
    }
}
</script>

</body>
</html>
