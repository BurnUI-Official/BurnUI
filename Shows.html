<!DOCTYPE html>
<html>
<head>
    
    <title>BurnUI - Shows</title>
    
    <link rel="icon" href="BurnUI.png" type="image/png">
    <link rel="shortcut icon" href="BurnUI.png" type="image/png">
    
    <link rel="apple-touch-icon" sizes="180x180" href="BurnUI.png">
    <link rel="apple-touch-icon" sizes="152x152" href="BurnUI.png">
    <link rel="apple-touch-icon" sizes="120x120" href="BurnUI.png">
    
    <style>
        
        html, body {
            height: 100%;
            margin: 0;
        }
        
        .top {
            background-color: red;
            border: 5px solid yellow;
            align-items: center;
            display: flex;
            margin: 35px;
        }
        
        .button {
            background-color: orangered;
            color: yellow;
            border: 5px solid yellow;
            border-radius: 12px;
            transition: transform 0.8s ease-in-out;
        }
        
        .button:hover {
            cursor: pointer;
            background-color: yellow;
            color: orangered;
            border: 5px solid orangered;
            border-radius: 12px;
        }
        
        .show {
            margin: 35px;
            background-color: red;
            width: 400px;
            display: grid;
            place-items: center;
            border: 5px solid yellow;
            height: 400px;
            border-radius: 52px;
        }
        
        .showTitle {
            color: yellow;
        }
        
        .shows {
            display: flex;
            flex-wrap: wrap;
        }
        
        .mF {
            color: greenyellow;
            font-size: 10px;
        }
        
    </style>
    
</head>
    
<body style="background-image: linear-gradient(to bottom, orange, red); background-repeat: no-repeat; height: 100%; background-size: cover; background-attachment: fixed; background-color: black;">
    
    <div class="top">
        <a href="index.html"><button style="height: 50px;" class="button">&lt;----</button></a>
        <p style="color: red" id="DIVIDER">====</p>
        <h1 style="font-size: 50px; font-family: Arial, Helvetica, sans-serif;">Shows</h1>
    </div>
    
    <div style="width: 100%; text-align: center; margin-top: 20px;">
        <input id="searchBar"
               type="text"
               placeholder="Search shows..."
               oninput="searchShows()"
               style="width: 94.5%; padding: 15px; font-size: 20px; border-radius: 12px; border: 4px solid yellow;">
    </div>
    
    <div class="shows">
        
        <div class="show" id="tfb">
            <img src="TFBshow.png" width="300" style="border-radius: 40px; border: 2px solid yellow;">
            <h2 class="showTitle">The Fruit Bunch</h2>
            <p class="showTitle">Cost: 3 BurnBux</p>
            <a href="TFB.html"><button class="button" style="width: 300px;" onclick="browseTFB">Browse</button></a>
        </div>
        
        <script>
function searchShows() {
    const query = document.getElementById("searchBar").value.toLowerCase();

    const games = [
        { id: "tfb", name: "the fruit bunch" },
    ];

    games.forEach(game => {
        const element = document.getElementById(game.id);
        if (game.name.includes(query)) {
            element.style.display = "grid";
        } else {
            element.style.display = "none";
        }
    });
}

// MOVIE MAKER COST SYSTEM
function browseTFB() {
    const user = localStorage.getItem("loggedInUser");
    if (!user) {
        alert("You must log in to spend BurnBux.");
        return;
    }

    const account = JSON.parse(localStorage.getItem(user));

    if (account.burnbux >= 3) {
        account.burnbux -= 3;
        localStorage.setItem(user, JSON.stringify(account));
        window.open("https://www.youtube.com/watch?v=wiObn1dZEnw", "_blank");
    } else {
        alert("You need 3 BurnBux to browse The Fruit Bunch!");
    }
}
</script>
    
</body>
</html>
